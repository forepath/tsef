openapi: 3.1.0
info:
  title: Forepath Communication API
  version: 1.0.0
  description: |
    Stateless HTTP API that proxies public contact requests and vulnerability reports to Chatwoot.

    Submissions require a valid Cloudflare Turnstile token. The service finds or creates a
    Chatwoot contact and opens a new conversation in the configured API channel inbox.
  contact:
    name: ForePath
    email: hi@forepath.io
    url: https://forepath.io
servers:
  - url: http://localhost:3300/api
    description: Local development
  - url: http://localhost:3300
    description: Root (OpenTelemetry metrics; outside /api prefix)
paths:
  /health:
    get:
      summary: Health check
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /public/contact-requests:
    post:
      summary: Submit a public contact request
      description: |
        Accepts a contact form submission protected by Cloudflare Turnstile. Creates or reuses a
        Chatwoot contact and opens a new conversation with the formatted message body.
      operationId: submitPublicContactRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
      responses:
        '201':
          description: Contact request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequestResponse'
        '400':
          description: Validation or captcha failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream Chatwoot error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /public/vulnerability-reports:
    post:
      summary: Submit a public vulnerability report
      description: |
        Accepts a vulnerability disclosure form submission protected by Cloudflare Turnstile.
        Creates or reuses a Chatwoot contact and opens a new conversation with the formatted report body.
      operationId: submitPublicVulnerabilityReport
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVulnerabilityReport'
      responses:
        '201':
          description: Vulnerability report accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VulnerabilityReportResponse'
        '400':
          description: Validation or captcha failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream Chatwoot error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /otel/metrics:
    get:
      summary: Prometheus metrics scrape
      description: |
        OpenTelemetry Prometheus exposition endpoint. Mounted at the HTTP root, **outside** the `/api` global prefix.
        Path is configurable via `OTEL_METRICS_PATH` (default `/otel/metrics`). Requires HTTP Basic authentication
        with `OTEL_USERNAME` and `OTEL_PASSWORD`. Disabled when `OTEL_ENABLED` is not exactly `true`.
      operationId: getOtelMetrics
      servers:
        - url: http://localhost:3300
      security:
        - basicAuth: []
      responses:
        '200':
          description: Prometheus text exposition format
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing or invalid Basic auth credentials
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  schemas:
    CreateContactRequest:
      type: object
      required:
        - name
        - email
        - message
        - turnstileToken
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        message:
          type: string
          minLength: 1
          maxLength: 5000
        phone:
          type: string
          maxLength: 30
        company:
          type: string
          maxLength: 200
        turnstileToken:
          type: string
          description: Cloudflare Turnstile response token
    ContactRequestResponse:
      type: object
      required:
        - accepted
        - referenceId
      properties:
        accepted:
          type: boolean
          enum: [true]
        referenceId:
          type: string
          description: Opaque conversation reference id
    CreateVulnerabilityReport:
      type: object
      required:
        - name
        - email
        - product
        - description
        - impact
        - stepsToReproduce
        - affectedVersions
        - turnstileToken
      properties:
        name:
          type: string
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
        product:
          type: string
          enum: [agenstra, decabill, forepath, shared, other]
        description:
          type: string
          minLength: 1
          maxLength: 5000
        impact:
          type: string
          minLength: 1
          maxLength: 5000
        stepsToReproduce:
          type: string
          minLength: 1
          maxLength: 5000
        affectedVersions:
          type: string
          minLength: 1
          maxLength: 500
        suggestedFix:
          type: string
          maxLength: 5000
        turnstileToken:
          type: string
          description: Cloudflare Turnstile response token
    VulnerabilityReportResponse:
      type: object
      required:
        - accepted
        - referenceId
      properties:
        accepted:
          type: boolean
          enum: [true]
        referenceId:
          type: string
          description: Opaque conversation reference id
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
